# SPDX-License-Identifier: GPL-3.0-or-later
[versions]
# --- Build tools ---
agp = "8.13.2"
# Kotlin 2.3.21 (Stable). Покрывает наш AGP 8.13.1 (диапазон 8.2.2–9.0.0).
# Kotlin 2.3.0 не подходит (потолок AGP 8.13.0). Апгрейд выполнен в Sub-PR #3a
# вместе с переходом на новый kotlin{compilerOptions{}} DSL.
kotlin = "2.3.21"
# KSP2 с 2.3.0 decoupled от Kotlin-компилятора — формат версии теперь
# самостоятельный, без префикса `<kotlin>-<ksp>`.
ksp = "2.3.8"

# --- AndroidX core / lifecycle ---
coreKtx = "1.13.1"
lifecycleRuntimeKtx = "2.8.5"
lifecycleViewmodelCompose = "2.8.5"
activityCompose = "1.9.2"
coreSplashscreen = "1.0.1"
appcompat = "1.7.0"

# --- Compose ---
# Compose Compiler с Kotlin 2.0+ встроен в Kotlin и тянется через плагин
# `org.jetbrains.kotlin.plugin.compose` той же версии, что и Kotlin
# (отдельной зависимости compose-compiler у нас нет).
composeBom = "2026.05.00"
navigationCompose = "2.8.0"

# --- Coroutines ---
coroutines = "1.10.2"

# --- Persistence ---
# Room 2.7.0+ требуется на KSP2 (`unexpected jvm signature V` regression в
# 2.6.x JvmDescriptorUtils для Unit-return `suspend` DAO-методов фикшен в
# 2.7.0-alpha11). 2.8.4 — последняя стабильная, безопасный выбор.
# Схема в `app/schemas/` остаётся совместимой, миграций не требуется.
room = "2.8.4"

# --- DI ---
# Hilt 2.57.2: Kotlin 2.3 metadata-проблема (issue google/dagger#5001) затрагивает
# ТОЛЬКО KAPT-маршрут; мы целиком на KSP (см. `ksp(libs.hilt.compiler)`), так что
# биндинги собираются чисто.
hilt = "2.57.2"
hiltNavigationCompose = "1.2.0"
hiltWork = "1.2.0"

# --- Background work ---
# 2.11.1 — последняя stable (янв 2026); work-testing публикуется вместе с runtime.
workManager = "2.11.1"

# --- Security / Settings ---
biometric = "1.1.0"
datastore = "1.1.1"
# SQLCipher 4.14+ — совместимость с Room 2.8.x (androidx.sqlite 2.6).
sqlcipher = "4.14.0"

# --- Serialization (encrypted backup payload) ---
kotlinxSerialization = "1.7.3"

# --- On-device LLM runtime (Gemma 4 через LiteRT-LM) ---
# Координаты — `com.google.ai.edge.litertlm:litertlm-android`.
# Артефакт 0.11.0 собран Kotlin 2.3.20 — после апгрейда Kotlin до 2.3.21
# в Sub-PR #3a metadata-несовместимости больше нет. Запись активна.
# Подключено в `app/build.gradle.kts` as `implementation(libs.litert.lm)`.
litertLm = "0.11.0"
glance = "1.1.0"
media3 = "1.6.1"

# --- Tests ---
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
testCore = "1.6.1"
robolectric = "4.14.1"

[libraries]
# AndroidX core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Room
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Hilt
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hiltWork" }
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hiltWork" }

# WorkManager
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "workManager" }

# Security / Settings
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

# Kotlinx Serialization (для зашифрованного экспорта/импорта истории)
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# LiteRT-LM (локальный инференс Gemma 4 без сетевых вызовов).
litert-lm = { group = "com.google.ai.edge.litertlm", name = "litertlm-android", version.ref = "litertLm" }

# Media3 (фоновая музыка на «Сегодня», только локальные файлы)
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }

# Tests
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "testCore" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
