name: Bug report
description: Create a report to help us improve Sanctum
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out a bug report!
        Since Sanctum is **fully offline**, please DO NOT paste any of your private reflections or journal entries here. Maintain your privacy first!
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Provide a clear and concise description of what the bug is.
      placeholder: E.g., The breathing exercise animation stutters when turning the screen...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How do we reproduce this behavior?
      placeholder: |
        1. Open Journal
        2. Tap "Breathing"
        3. Rotate the device...
    validations:
      required: true
  - type: input
    id: device-info
    attributes:
      label: Device Information
      description: E.g., Google Pixel 7, Android 13, 8 GB RAM
      placeholder: Pixel 7, Android 13, 8 GB RAM
    validations:
      required: true
  - type: dropdown
    id: app-version
    attributes:
      label: Sanctum Version
      options:
        - v1.0.x (Latest)
        - Pre-release / From source
        - Other (please specify in description)
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: The exercise should continue seamlessly...
    validations:
      required: true
